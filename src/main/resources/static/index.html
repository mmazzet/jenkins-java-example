<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Version Display App 🎄</title>
    <style>
        /* Body and background */
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Snowflakes */
        .snowflake {
            position: absolute;
            color: white;
            font-size: 1em;
            user-select: none;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10%); opacity: 1; }
            100% { transform: translateY(110vh); opacity: 0; }
        }

        /* Main container */
        .container {
            background: #ffffff;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 3px solid #d32f2f; /* festive red border */
        }

        h1 {
            font-size: 2.5em;
            color: #d32f2f; /* red */
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1em;
            margin: 10px 0;
            color: #2e7d32; /* green */
        }

        a.button {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background-color: #fbc02d; /* gold */
            padding: 12px 25px;
            border-radius: 12px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 15px;
        }

        a.button:hover {
            background-color: #f57f17;
        }

        .footer {
            margin-top: 25px;
            font-size: 0.9em;
            color: #777;
        }

        /* Christmas banner */
        .banner {
            font-size: 1.2em;
            color: #d32f2f;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="banner">🎅 Merry Christmas! 🎄</div>
    <h1>Version Display App</h1>
    <p>Welcome! This is a minimal Java Maven application running with Spring Boot.</p>
    <p>Check the current version and build timestamp:</p>
    <a class="button" href="/version">View Version</a>
    <div class="footer">
        &copy; 2025 objectObject LLC
    </div>
</div>

<!-- Snowflake generation -->
<script>
    const snowCount = 30;
    for (let i = 0; i < snowCount; i++) {
        const snow = document.createElement('div');
        snow.className = 'snowflake';
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.fontSize = Math.random() * 20 + 10 + 'px';
        snow.style.animationDuration = (5 + Math.random() * 10) + 's';
        snow.style.animationDelay = Math.random() * 10 + 's';
        snow.innerText = '❄';
        document.body.appendChild(snow);
    }
</script>
</body>
</html>
